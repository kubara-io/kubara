name: run renovatebot

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovatebot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kubara repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_GITHUB_APP_ID }}
          private-key: ${{ secrets.RENOVATE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}

      - name: Run renovatebot
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GITHUB_COM_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_PR_HOURLY_LIMIT: 0
          RENOVATE_PR_CONCURRENT_LIMIT: 50
          RENOVATE_ALLOWED_COMMANDS: '^\./\.scripts/renovate_bot_update_helm_changelog\.sh.*$'
          # LOG_LEVEL: debug
          # RENOVATE_DRY_RUN: full
