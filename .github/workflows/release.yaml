name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - name: Checkout kubara repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_GITHUB_APP_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            homebrew-tap

      - name: Resolve default catalog releases
        id: catalogs
        shell: bash
        env:
          # Authenticated reads of the public catalogs repo lift the API rate
          # limit from 60/h per runner IP to 1000/h.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for catalog in bootstrap general; do
            case "$catalog" in
              bootstrap)
                symbol="DefaultBootstrapCatalog"
                ;;
              general)
                symbol="DefaultGeneralCatalog"
                ;;
            esac

            ref="$(
              awk -v name="$symbol" \
                '$1 == name { gsub(/"/, "", $3); print $3 }' \
                src/internal/catalog/bootstrap.go
            )"

            if [[ -z "$ref" ]]; then
              echo "::error::Could not resolve $symbol"
              exit 1
            fi

            version="${ref##*:}"

            # The existing 1.1.0 releases predate the current "-v" tag convention.
            if [[ "$version" == "1.1.0" ]]; then
              tag="${catalog}-${version}"
            else
              tag="${catalog}-v${version}"
            fi

            url="https://github.com/${GITHUB_REPOSITORY_OWNER}/catalogs/releases/tag/${tag}"
            api_url="https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/catalogs/releases/tags/${tag}"

            echo "Checking ${tag}"
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$api_url" > /dev/null

            {
              echo "${catalog}-version=${version}"
              echo "${catalog}-url=${url}"
            } >> "$GITHUB_OUTPUT"
          done

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 #v0.24.0

      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@3e084b0caf710f7bfead967567539214f598c0a2 #v2.0.1

      - name: Run GoReleaser
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: src
          args: release --clean
        env:
          BOOTSTRAP_CATALOG_VERSION: ${{ steps.catalogs.outputs.bootstrap-version }}
          BOOTSTRAP_CATALOG_URL: ${{ steps.catalogs.outputs.bootstrap-url }}
          GENERAL_CATALOG_VERSION: ${{ steps.catalogs.outputs.general-version }}
          GENERAL_CATALOG_URL: ${{ steps.catalogs.outputs.general-url }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # The base64 of the contents of your '.p12' key.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          # The password to open the '.p12' key.
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          # The base64 of the contents of your '.p8' key.
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          # The ID of the '.p8' key.
          # You can find it in the filename, as well as the Apple Developer Portal website.
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          # The issuer UUID.
          # You can find it in the Apple Developer Portal website.
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          # CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
