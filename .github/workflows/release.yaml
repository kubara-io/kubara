name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  # renovate: datasource=github-releases depName=oras-project/oras extractVersion=^v(?<version>.*)$
  ORAS_VERSION: "1.3.1"
  CATALOG_IMAGES_REPO: ghcr.io/${{ github.repository_owner }}/catalogs


jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - name: Checkout kubara repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_GITHUB_APP_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            homebrew-tap

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 #v0.24.0

      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@3e084b0caf710f7bfead967567539214f598c0a2 #v2.0.1

      - name: Verify preinstalled Helm
        run: |
          set -euo pipefail
          helm version --short

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}


      - name: Pull Images list from Catalog
        id: images
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          out="$RUNNTER_TEMP/catalog-images"

          for catalog in bootstrap general; do
            oras pull "${CATALOG_IMAGES_REPO}/$P{catalog}-images:latest" -o "$out/$catalog"
          done

          cat "$out"/*/images.txt | sort -u > "$out/platform-images.txt"
          cat "$out/*/chart.txt" | sort -u > "$out/helm-images-ver.txt"

          echo "Images used for this release"
          cat /tmp/platform-images.txt
          echo "Helm Chart Versions used for this release"
          cat /tmp/helm-images-ver.txt
          
          # write to Github Actions environment
          echo "Writing images into release"

          {
            echo 'images-list<<KUBARA_IMAGES_EOF'
            cat "$out/platform-images.txt"
            echo 'KUBARA_IMAGES_EOF'
          } >> "$GITHUB_OUTPUT"
      
          {
            echo 'helm-images-ver<<KUBARA_HELM_IMAGES_EOF'
            cat "$out/helm-images-ver.txt"
            echo 'KUBARA_HELM_IMAGES_EOF'
          } >> "$GITHUB_OUTPUT"


          



      - name: Run GoReleaser
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: src
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          KUBARA_IMAGE_LIST: ${{ steps.images.outputs.images-list }}
          HELM_IMAGES_VER: ${{ steps.images.outputs.helm-images-ver }}
          # The base64 of the contents of your '.p12' key.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          # The password to open the '.p12' key.
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          # The base64 of the contents of your '.p8' key.
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          # The ID of the '.p8' key.
          # You can find it in the filename, as well as the Apple Developer Portal website.
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          # The issuer UUID.
          # You can find it in the Apple Developer Portal website.
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          # CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
