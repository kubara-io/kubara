---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platformsetups.kubara.io
spec:
  group: kubara.io
  scope: Cluster
  names:
    plural: platformsetups
    singular: platformsetup
    kind: PlatformSetup
    shortNames:
      - ps
  versions:
    - name: v1alpha5
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [apiVersion, kind, metadata, spec]
          properties:
            apiVersion:
              type: string
              enum: [kubara.io/v1alpha5]
            kind:
              type: string
              enum: [PlatformSetup]
            metadata:
              type: object
            spec:
              type: object
              required: [clusters]
              additionalProperties: false
              properties:
                bootstrapCatalog:
                  type: string
                  description: Global bootstrap catalog reference.
                clusters:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, dnsName, argocd, services]
                    additionalProperties: false
                    properties:
                      name:
                        type: string
                        minLength: 1
                      stage:
                        type: string
                        minLength: 1
                        default: dev
                      type:
                        type: string
                        enum: [hub, spoke]
                        default: hub
                      dnsName:
                        type: string
                        format: hostname
                      ssoOrg:
                        type: string
                        minLength: 1
                      ssoTeam:
                        type: string
                        minLength: 1
                      ingressClassName:
                        type: string
                        minLength: 1
                        default: traefik
                      catalogs:
                        type: array
                        items:
                          type: string
                      terraform:
                        type: object
                        additionalProperties: false
                        required: [provider]
                        properties:
                          provider:
                            type: string
                            enum: [none, stackit, t-cloud-public]
                            default: none
                          projectId:
                            type: string
                            minLength: 1
                          kubernetesType:
                            type: string
                            enum: [edge, ske, cce]
                            default: ske
                          kubernetesVersion:
                            type: string
                            pattern: '^[0-9]\.[0-9]+(\.[0-9]+)?$'
                          dns:
                            type: object
                            additionalProperties: false
                            required: [name, email]
                            properties:
                              name:
                                type: string
                                format: hostname
                              email:
                                type: string
                                format: email
                        x-kubernetes-validations:
                          - rule: self.provider == 'none' || (has(self.projectId) && has(self.kubernetesVersion) && has(self.dns))
                            message: projectId, kubernetesVersion, and dns are required when terraform.provider is enabled
                          - rule: self.provider != 'stackit' || self.kubernetesType in ['ske', 'edge']
                            message: stackit supports kubernetesType ske or edge
                          - rule: self.provider != 't-cloud-public' || self.kubernetesType == 'cce'
                            message: t-cloud-public supports kubernetesType cce
                      argocd:
                        type: object
                        additionalProperties: false
                        required: [repo]
                        properties:
                          selfManaged:
                            type: string
                            enum: [enabled, disabled]
                            default: enabled
                          repo:
                            type: object
                            additionalProperties: false
                            properties:
                              https:
                                type: object
                                additionalProperties: false
                                required: [configs, components]
                                properties:
                                  configs:
                                    type: object
                                    additionalProperties: false
                                    required: [url]
                                    properties:
                                      url:
                                        type: string
                                        format: uri
                                      path:
                                        type: string
                                      targetRevision:
                                        type: string
                                        minLength: 1
                                        default: main
                                  components:
                                    type: object
                                    additionalProperties: false
                                    required: [url]
                                    properties:
                                      url:
                                        type: string
                                        format: uri
                                      path:
                                        type: string
                                      targetRevision:
                                        type: string
                                        minLength: 1
                                        default: main
                              oci:
                                type: object
                                additionalProperties: false
                                required: [configs, components]
                                properties:
                                  configs:
                                    type: object
                                    additionalProperties: false
                                    required: [url]
                                    properties:
                                      url:
                                        type: string
                                        format: uri
                                      path:
                                        type: string
                                      targetRevision:
                                        type: string
                                        minLength: 1
                                        default: main
                                  components:
                                    type: object
                                    additionalProperties: false
                                    required: [url]
                                    properties:
                                      url:
                                        type: string
                                        format: uri
                                      path:
                                        type: string
                                      targetRevision:
                                        type: string
                                        minLength: 1
                                        default: main
                            x-kubernetes-validations:
                              - rule: has(self.https) != has(self.oci)
                                message: exactly one of https or oci must be configured
                          helmRepo:
                            type: object
                            additionalProperties: false
                            required: [url]
                            properties:
                              url:
                                type: string
                      services:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
