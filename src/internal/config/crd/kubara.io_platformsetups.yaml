---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: platformsetups.kubara.io
spec:
  group: kubara.io
  names:
    kind: PlatformSetup
    listKind: PlatformSetupList
    plural: platformsetups
    shortNames:
    - ps
    singular: platformsetup
  scope: Cluster
  versions:
  - name: v1alpha7
    schema:
      openAPIV3Schema:
        description: PlatformSetup is the Schema for the platformsetups API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of the platform setup configuration.
            properties:
              bootstrapCatalog:
                description: BootstrapCatalog is the global bootstrap catalog reference.
                minLength: 1
                type: string
              clusters:
                description: Clusters defines the list of Kubernetes clusters managed
                  by the platform.
                items:
                  description: Cluster defines the configuration for a single Kubernetes
                    cluster.
                  properties:
                    argocd:
                      description: ArgoCD configures the Argo CD deployment and repository
                        settings for the cluster.
                      properties:
                        helmRepo:
                          description: HelmRepo configures an optional Helm chart
                            repository for Argo CD.
                          properties:
                            url:
                              description: URL is the Helm chart repository URL.
                              format: uri
                              type: string
                          required:
                          - url
                          type: object
                        repo:
                          description: Repo configures the Git or OCI repository sources
                            for Argo CD applications.
                          properties:
                            authMode:
                              description: AuthMode specifies the authentication mechanism
                                used for Git operations.
                              enum:
                              - https
                              - ssh
                              - github-app
                              type: string
                            git:
                              description: Git configures Git repositories for platform
                                configs and components.
                              properties:
                                components:
                                  description: Components is the repository containing
                                    platform component manifests.
                                  properties:
                                    path:
                                      description: Path is an optional subdirectory
                                        path within the repository.
                                      type: string
                                    targetRevision:
                                      default: main
                                      description: TargetRevision is the branch, tag,
                                        or commit to track.
                                      minLength: 1
                                      type: string
                                    url:
                                      description: URL is the repository address (e.g.
                                        HTTPS or SSH URL).
                                      minLength: 1
                                      type: string
                                  required:
                                  - url
                                  type: object
                                configs:
                                  description: Configs is the repository containing
                                    platform configuration definitions.
                                  properties:
                                    path:
                                      description: Path is an optional subdirectory
                                        path within the repository.
                                      type: string
                                    targetRevision:
                                      default: main
                                      description: TargetRevision is the branch, tag,
                                        or commit to track.
                                      minLength: 1
                                      type: string
                                    url:
                                      description: URL is the repository address (e.g.
                                        HTTPS or SSH URL).
                                      minLength: 1
                                      type: string
                                  required:
                                  - url
                                  type: object
                              required:
                              - components
                              - configs
                              type: object
                            oci:
                              description: OCI configures OCI registry repositories
                                for platform configs and components.
                              properties:
                                components:
                                  description: Components is the repository containing
                                    platform component manifests.
                                  properties:
                                    path:
                                      description: Path is an optional subdirectory
                                        path within the repository.
                                      type: string
                                    targetRevision:
                                      default: main
                                      description: TargetRevision is the branch, tag,
                                        or commit to track.
                                      minLength: 1
                                      type: string
                                    url:
                                      description: URL is the repository address (e.g.
                                        HTTPS or SSH URL).
                                      minLength: 1
                                      type: string
                                  required:
                                  - url
                                  type: object
                                configs:
                                  description: Configs is the repository containing
                                    platform configuration definitions.
                                  properties:
                                    path:
                                      description: Path is an optional subdirectory
                                        path within the repository.
                                      type: string
                                    targetRevision:
                                      default: main
                                      description: TargetRevision is the branch, tag,
                                        or commit to track.
                                      minLength: 1
                                      type: string
                                    url:
                                      description: URL is the repository address (e.g.
                                        HTTPS or SSH URL).
                                      minLength: 1
                                      type: string
                                  required:
                                  - url
                                  type: object
                              required:
                              - components
                              - configs
                              type: object
                          type: object
                          x-kubernetes-validations:
                          - message: exactly one of git or oci must be configured
                            rule: has(self.git) != has(self.oci)
                        selfManaged:
                          default: enabled
                          description: SelfManaged indicates whether Argo CD should
                            be self-managed by the platform.
                          enum:
                          - enabled
                          - disabled
                          type: string
                      required:
                      - repo
                      type: object
                    catalogs:
                      description: Catalogs specifies additional catalog references
                        available to this cluster.
                      items:
                        type: string
                      type: array
                    dnsName:
                      description: DNSName is the primary domain name for the cluster.
                      format: hostname
                      type: string
                    name:
                      description: Name is the unique identifier for the cluster.
                      minLength: 1
                      type: string
                    networking:
                      description: Networking configures routing settings consumed
                        by catalog templates.
                      properties:
                        gateway:
                          description: Gateway configures global Gateway settings.
                          properties:
                            name:
                              description: Name of the parent Gateway.
                              minLength: 1
                              type: string
                            namespace:
                              description: Namespace of the parent Gateway.
                              minLength: 1
                              type: string
                            sectionName:
                              description: Optional listener name on the parent Gateway.
                              minLength: 1
                              type: string
                          required:
                          - name
                          - namespace
                          type: object
                        ingress:
                          description: Ingress configures global Ingress settings.
                          properties:
                            className:
                              default: traefik
                              description: ClassName is the Ingress class name to
                                use for routing resources.
                              minLength: 1
                              type: string
                          type: object
                        type:
                          default: ingress
                          description: Type selects the routing API (Ingress or Gateway
                            API) used by catalog templates.
                          enum:
                          - ingress
                          - gateway
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: networking.gateway is required when type is gateway
                        rule: '!has(self.type) || self.type != ''gateway'' || has(self.gateway)'
                    services:
                      description: Services configures the platform services deployed
                        on this cluster.
                      x-kubernetes-preserve-unknown-fields: true
                    ssoOrg:
                      description: SSOOrg is the single sign-on organization identifier
                        for access control.
                      minLength: 1
                      type: string
                    ssoTeam:
                      description: SSOTeam is the single sign-on team identifier within
                        the organization.
                      minLength: 1
                      type: string
                    stage:
                      default: dev
                      description: Stage is the deployment environment stage (e.g.,
                        dev, staging, prod).
                      minLength: 1
                      type: string
                    terraform:
                      description: Terraform configures infrastructure provisioning
                        for the cluster.
                      properties:
                        dns:
                          description: DNS configures the DNS settings for the infrastructure
                            provider.
                          properties:
                            email:
                              description: Email is the administrator contact email
                                for DNS records.
                              format: email
                              type: string
                            name:
                              description: Name is the managed DNS zone or domain
                                name.
                              format: hostname
                              type: string
                          required:
                          - email
                          - name
                          type: object
                        ephemeralSecrets:
                          description: |-
                            Ephemeral Secrets generate supported secret inputs and payloads without persisting their values in state or plans.
                            Requires compatible catalog templates. Omitted or false preserves the existing stateful workflow.
                          type: boolean
                        kubernetesType:
                          default: ske
                          description: KubernetesType specifies the managed Kubernetes
                            offering (e.g., ske, edge, cce).
                          enum:
                          - edge
                          - ske
                          - cce
                          type: string
                        kubernetesVersion:
                          description: KubernetesVersion specifies the target Kubernetes
                            version (e.g., 1.30 or 1.30.1).
                          pattern: ^[0-9]\.[0-9]+(\.[0-9]+)?$
                          type: string
                        projectId:
                          description: ProjectID is the cloud provider project or
                            tenant identifier.
                          minLength: 1
                          type: string
                        provider:
                          default: none
                          description: Provider specifies the infrastructure provider
                            to use for cluster provisioning.
                          enum:
                          - none
                          - stackit
                          - t-cloud-public
                          type: string
                      required:
                      - provider
                      type: object
                      x-kubernetes-validations:
                      - message: projectId, kubernetesVersion, and dns are required
                          when terraform.provider is enabled
                        rule: self.provider == 'none' || (has(self.projectId) && has(self.kubernetesVersion)
                          && has(self.dns))
                      - message: stackit supports kubernetesType ske or edge
                        rule: self.provider != 'stackit' || self.kubernetesType in
                          ['ske', 'edge']
                      - message: t-cloud-public supports kubernetesType cce
                        rule: self.provider != 't-cloud-public' || self.kubernetesType
                          == 'cce'
                    type:
                      default: hub
                      description: Type specifies whether this cluster is a hub or
                        spoke cluster.
                      enum:
                      - hub
                      - spoke
                      type: string
                  required:
                  - argocd
                  - dnsName
                  - name
                  - services
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - clusters
            type: object
            x-kubernetes-validations:
            - message: exactly one cluster must be of type hub
              rule: self.clusters.size() == 0 || self.clusters.filter(c, c.type ==
                'hub').size() == 1
        required:
        - spec
        type: object
    served: true
    storage: true
