---
# Generated by kubara init --github-actions.
name: Update kubara catalogs
'on':
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: kubara-catalog-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      # Replace main with a reviewed commit containing the action and CI scripts.
      - uses: kubara-io/kubara@main
        with:
          args: '[]'
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6  # v1
        with:
          version: 1.3.0
      - name: Update versions and generate
        id: generate
        run: |
          bash .scripts/kubara-catalog-update.sh
          if [ -n "$(git status --porcelain -- config.yaml platform-configs/ platform-components/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7
        if: steps.generate.outputs.changed == 'true'
        with:
          branch: automation/kubara-catalog-update
          title: 'chore: update kubara catalogs and generated manifests'
          commit-message: 'chore: update kubara catalogs and generated manifests'
          body: |
            Refresh explicit bootstrap and general catalog versions and regenerate platform artifacts.
            Review version changes and rendered manifests before merging.
          add-paths: |-
            config.yaml
            platform-configs/
            platform-components/
