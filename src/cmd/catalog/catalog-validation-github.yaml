---
name: Validate catalog
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Pin to a reviewed kubara release or commit containing the action.
      - uses: kubara-io/kubara@main
        with:
          args: '["schema", "--catalog", ".", "--output", "/tmp/catalog.schema.json"]'
      - name: Check catalog packaging
        run: kubara catalog package
