---
# Generated by kubara init --gitlab-ci.
kubara-update:
  image: alpine:3.24.2
  resource_group: kubara-catalog-update
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    GIT_DEPTH: '0'
    KUBARA_VERSION: latest
    KUBARA_INSTALL_DIR: /tmp/kubara-ci-bin
  before_script:
    - apk add --no-cache bash git curl ca-certificates jq yq
    # Pin the installer to a reviewed kubara revision.
    - curl -fsSL https://raw.githubusercontent.com/kubara-io/kubara/main/install.sh -o /tmp/install-kubara.sh
    - sh /tmp/install-kubara.sh
    - sh .scripts/install-oras.sh "$KUBARA_INSTALL_DIR"
    - export PATH="$KUBARA_INSTALL_DIR:$PATH"
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - git checkout -B automation/kubara-catalog-update FETCH_HEAD
    - bash .scripts/kubara-catalog-update.sh
    - |-
      set -eu
      branch=automation/kubara-catalog-update
      for path in config.yaml platform-configs platform-components; do
        if [ -e "$path" ] || [ -n "$(git ls-files -- "$path")" ]; then
          git add -A -- "$path"
        fi
      done
      if git diff --cached --quiet; then
        echo 'No changes against the target branch'
        exit 0
      fi
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests"
      requests=$(curl -fsS --get --header "PRIVATE-TOKEN: $KUBARA_UPDATE_TOKEN" \
        --data-urlencode state=opened --data-urlencode "source_branch=$branch" \
        --data-urlencode "target_branch=$CI_DEFAULT_BRANCH" "$api")
      remote=$(git ls-remote origin "refs/heads/$branch")
      previous=${remote%%[[:space:]]*}
      remote_tree=''
      if [ -n "$previous" ]; then
        git fetch origin "refs/heads/$branch"
        remote_tree=$(git rev-parse 'FETCH_HEAD^{tree}')
      fi
      if [ "$(git write-tree)" != "$remote_tree" ]; then
        git -c user.name='kubara automation' -c user.email='kubara-bot@users.noreply.gitlab.com' \
          commit -m 'chore: update kubara catalogs and generated manifests'
        askpass=$(mktemp)
        trap 'rm -f "$askpass"' EXIT
        cat > "$askpass" <<'SH'
      #!/bin/sh
      case "$1" in
        *Username*) echo oauth2 ;;
        *) printf '%s\n' "$KUBARA_UPDATE_TOKEN" ;;
      esac
      SH
        chmod 700 "$askpass"
        GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -c credential.helper= push \
          "--force-with-lease=refs/heads/$branch:$previous" "$CI_PROJECT_URL.git" "HEAD:refs/heads/$branch"
      fi
      if [ "$(printf '%s' "$requests" | jq 'length')" -eq 0 ]; then
        response=$(curl -fsS --header "PRIVATE-TOKEN: $KUBARA_UPDATE_TOKEN" \
          --data-urlencode "source_branch=$branch" --data-urlencode "target_branch=$CI_DEFAULT_BRANCH" \
          --data-urlencode 'title=chore: update kubara catalogs and generated manifests' \
          "$api")
        printf '%s' "$response" | jq -er '.web_url'
      else
        printf '%s' "$requests" | jq -r '.[0].web_url'
      fi
