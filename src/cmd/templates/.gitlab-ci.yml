---
# Generated by kubara init --gitlab-ci.
stages:
  - generate

variables:
  GIT_DEPTH: '0'
  KUBARA_VERSION: latest
  KUBARA_INSTALL_DIR: /tmp/kubara-ci-bin

kubara-generate:
  stage: generate
  image: alpine:3.24.2
  resource_group: kubara-generate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache bash git curl ca-certificates jq
    - curl -fsSL https://raw.githubusercontent.com/kubara-io/kubara/main/install.sh -o /tmp/install-kubara.sh
    - sh /tmp/install-kubara.sh
    - export PATH="$KUBARA_INSTALL_DIR:$PATH"
  script:
    - mkdir -p /tmp/kubara-home
    - env -i PATH="$PATH" HOME="/tmp/kubara-home" LANG=C.UTF-8 PROJECT_NAME=generation PROJECT_STAGE=ci ARGOCD_WIZARD_ACCOUNT_PASSWORD=unused-generation-placeholder ARGOCD_GIT_HTTPS_URL=https://example.invalid/config.git kubara --env-file /dev/null generate
    - find platform-components platform-configs -type f \( -name 'set-env-changeme.sh' -o -name 'set-env-changeme.ps1' \) -delete
    - |
      if grep -rFq 'unused-generation-placeholder' platform-components platform-configs; then
        echo 'A catalog rendered the placeholder password; refusing to publish.' >&2
        exit 1
      fi
    - |
      # Kubara also persists schema migrations to its source configuration.
      for path in config.yaml platform-configs platform-components; do
        if [ -e "$path" ] || [ -n "$(git ls-files -- "$path")" ]; then
          git add -A -- "$path"
        fi
      done
      if git diff --cached --quiet; then
        echo 'No drift detected in generated platform artifacts.'
        exit 0
      fi
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo 'Changes detected in generated artifacts on merge request.'
        git diff --cached --stat
        git config user.name 'kubara automation'
        git config user.email '[EMAIL_REDACTED]'
        git commit -m 'chore: regenerate kubara artifacts'
        askpass=$(mktemp)
        trap 'rm -f "$askpass"' EXIT
        cat > "$askpass" <<'SH'
      #!/bin/sh
      case "$1" in
        *Username*) echo oauth2 ;;
        *) printf '%s\n' "${KUBARA_UPDATE_TOKEN:-$CI_JOB_TOKEN}" ;;
      esac
      SH
        chmod 700 "$askpass"
        GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -c credential.helper= push "$CI_PROJECT_URL.git" "HEAD:refs/heads/$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      else
        echo 'Drift detected on default branch. Opening or updating merge request.'
        branch=automation/kubara-drift
        git checkout -B "$branch"
        git config user.name 'kubara automation'
        git config user.email '[EMAIL_REDACTED]'
        git commit -m 'chore: regenerate kubara artifacts'
        askpass=$(mktemp)
        trap 'rm -f "$askpass"' EXIT
        cat > "$askpass" <<'SH'
      #!/bin/sh
      case "$1" in
        *Username*) echo oauth2 ;;
        *) printf '%s\n' "${KUBARA_UPDATE_TOKEN:-$CI_JOB_TOKEN}" ;;
      esac
      SH
        chmod 700 "$askpass"
        GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -c credential.helper= push \
          -o merge_request.create \
          -o merge_request.target="$CI_DEFAULT_BRANCH" \
          -o merge_request.title="chore: regenerate kubara artifacts" \
          -o merge_request.remove_source_branch \
          "$CI_PROJECT_URL.git" "HEAD:refs/heads/$branch"
      fi
