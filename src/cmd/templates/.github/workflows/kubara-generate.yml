name: Generate Kubara artifacts
# Uses config.yaml and its catalogs from the repository root.

on:
  pull_request:
    paths:
      - config.yaml
      - .github/workflows/kubara-generate.yml
      # Add local catalog paths if stored in this repository:
      # - my-catalog/**
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      pull-request:
        description: Open same-repository PR number to regenerate (leave empty for drift check)
        required: false
        type: string
      write:
        description: Commit generated changes
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kubara-generate-${{ github.event.pull_request.number || inputs.pull-request || 'drift' }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Select target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
            gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
            jq -e --arg repo "$REPOSITORY" \
              '.state == "open" and .head.repo.full_name == $repo and .head.ref != .base.ref' "$RUNNER_TEMP/pr.json"
            jq -r '"head=\(.head.sha)", "branch=\(.head.ref)", "is_pr=true"' "$RUNNER_TEMP/pr.json" >> "$GITHUB_OUTPUT"
          else
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.head || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install Kubara
        # renovate: datasource=github-releases depName=kubara-io/kubara extractVersion=^v(?<version>.*)$
        uses: kubara-io/kubara@main
        with:
          version: latest
          args: '[]'

      - name: Generate artifacts
        id: render
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kubara/home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/kubara/home" LANG=C.UTF-8 \
            PROJECT_NAME=generation PROJECT_STAGE=ci \
            ARGOCD_WIZARD_ACCOUNT_PASSWORD=unused-generation-placeholder \
            ARGOCD_GIT_HTTPS_URL=https://example.invalid/config.git \
            kubara --env-file /dev/null generate 2>&1 | tee "$RUNNER_TEMP/kubara/generate.log"
          find platform-components platform-configs -type f \
            \( -name 'set-env-changeme.sh' -o -name 'set-env-changeme.ps1' \) -delete
          if grep -rFq 'unused-generation-placeholder' platform-components platform-configs; then
            echo 'A catalog rendered the placeholder password; refusing to publish.' >&2
            exit 1
          fi
          git add -- platform-components platform-configs
          git diff --cached --binary > "$RUNNER_TEMP/kubara/generated.patch"
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          echo "changed=$([[ -s "$RUNNER_TEMP/kubara/generated.patch" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Save patch artifact
        if: steps.render.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kubara-generated-patch
          path: ${{ runner.temp }}/kubara/generated.patch
          retention-days: 7

      - name: Commit generated changes to PR
        if: steps.render.outputs.changed == 'true' && steps.target.outputs.is_pr == 'true' && (github.event_name != 'workflow_dispatch' || inputs.write)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request }}
          EXPECTED_HEAD: ${{ steps.target.outputs.head }}
          PR_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" | jq -e \
            --arg sha "$EXPECTED_HEAD" --arg branch "$PR_BRANCH" \
            '.state == "open" and .head.sha == $sha and .head.ref == $branch'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'chore: regenerate kubara artifacts'
          git -c core.hooksPath=/dev/null -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$PR_BRANCH"

      - name: Update PR comment
        if: steps.target.outputs.is_pr == 'true' && !cancelled() && steps.render.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request }}
          RESULT: ${{ steps.render.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '<!-- kubara-generate -->'
            printf '### Kubara generate: %s\n\n[Workflow run](%s)\n\n' "$RESULT" "$RUN_URL"
            echo '<details><summary>Generation output (last 40 KB)</summary><pre>'
            tail -c 40000 "$RUNNER_TEMP/kubara/generate.log" \
              | sed -E $'s/\x1b\\[[0-9;]*[[:alpha:]]//g' \
              | sed 's/\&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
            echo '</pre></details>'
          } > "$RUNNER_TEMP/kubara/comment.md"
          comment_id=$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- kubara-generate -->"))) | .id' | head -n 1)
          endpoint="repos/$REPOSITORY/issues/$PR_NUMBER/comments"
          method=POST
          if [[ -n "$comment_id" ]]; then
            endpoint="repos/$REPOSITORY/issues/comments/$comment_id"
            method=PATCH
          fi
          jq -n --rawfile body "$RUNNER_TEMP/kubara/comment.md" '{body: $body}' \
            | gh api --method "$method" "$endpoint" --input - > /dev/null

      - name: Open PR for drift on default branch
        if: steps.render.outputs.changed == 'true' && steps.target.outputs.is_pr == 'false' && (github.event_name != 'workflow_dispatch' || inputs.write)
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRIFT_BRANCH: automation/kubara-drift
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$DRIFT_BRANCH"
          git -c core.hooksPath=/dev/null commit -m 'chore: regenerate kubara artifacts'
          git -c core.hooksPath=/dev/null -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$DRIFT_BRANCH" --force
          existing_pr=$(gh pr list --head "$DRIFT_BRANCH" --base "$DEFAULT_BRANCH" --json number --jq '.[0].number')
          if [[ -z "$existing_pr" ]]; then
            gh pr create \
              --head "$DRIFT_BRANCH" \
              --base "$DEFAULT_BRANCH" \
              --title 'chore: regenerate kubara artifacts' \
              --body 'Automated drift detection identified changes between configured catalogs and committed manifests.'
          fi
