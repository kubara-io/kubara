name: Generate Kubara artifacts
# Uses config.yaml and its catalogs from the repository root.

on:
  pull_request:
    paths:
      - config.yaml
      - .github/workflows/kubara-generate.yml
      # Add local catalog paths if stored in this repository:
      # - my-catalog/**
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      pull-request:
        description: Open same-repository PR number to regenerate (leave empty for drift check)
        required: false
        type: string
      write:
        description: Commit generated changes
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kubara-generate-${{ github.event.pull_request.number || inputs.pull-request || 'drift' }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # renovate: datasource=github-releases depName=kubara-io/kubara extractVersion=^v(?<version>.*)$
      KUBARA_VERSION: 0.18.0
    steps:
      - name: Select target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            # Ensure PR number input is strictly an integer before querying GitHub API
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
            gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
            jq -e --arg repo "$REPOSITORY" \
              '.state == "open" and .head.repo.full_name == $repo and .head.ref != .base.ref' "$RUNNER_TEMP/pr.json"
            jq -r '"head=\(.head.sha)", "branch=\(.head.ref)", "is_pr=true"' "$RUNNER_TEMP/pr.json" >> "$GITHUB_OUTPUT"
          else
            default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
            [[ -n "$default_branch" && "$default_branch" != "null" ]]
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            echo "branch=$default_branch" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.head || steps.target.outputs.branch }}
          persist-credentials: false

      - name: Install Kubara
        uses: kubara-io/kubara-action@7525333662824339b4df949ef5e5e82a518cae65 # v0.1.0
        with:
          version: ${{ env.KUBARA_VERSION }}
          args: '[]'

      # Optional: log into a private catalog registry. Set CATALOG_REGISTRY_USER and CATALOG_REGISTRY_TOKEN,
      # replace ghcr.io with your private registry, then uncomment:
      # - name: Log into private catalog registry
      #   run: |
      #     echo "${{ secrets.CATALOG_REGISTRY_TOKEN }}" | kubara catalog login \
      #       --username "${{ secrets.CATALOG_REGISTRY_USER }}" \
      #       --password-stdin \
      #       ghcr.io

      - name: Generate artifacts
        id: render
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kubara/home"
          if [ -f "$HOME/.kubara/credentials.json" ]; then
            mkdir -p "$RUNNER_TEMP/kubara/home/.kubara"
            cp "$HOME/.kubara/credentials.json" "$RUNNER_TEMP/kubara/home/.kubara/credentials.json"
          fi
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/kubara/home" LANG=C.UTF-8 \
            kubara generate 2>&1 | tee "$RUNNER_TEMP/kubara/generate.log"
          existing_dirs=""
          for d in platform-components platform-configs; do
            if [ -d "$d" ]; then
              existing_dirs="$existing_dirs $d"
            fi
          done
          if [ -n "$existing_dirs" ]; then
            find $existing_dirs -type f \
              \( -name 'set-env-changeme.sh' -o -name 'set-env-changeme.ps1' \) -delete
          fi
          # Kubara also persists schema migrations to its source configuration.
          for path in config.yaml platform-configs platform-components; do
            if [ -e "$path" ] || [ -n "$(git ls-files -- "$path")" ]; then
              git add -A -- "$path"
            fi
          done
          git diff --cached --binary > "$RUNNER_TEMP/kubara/generated.patch"
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          echo "changed=$([[ -s "$RUNNER_TEMP/kubara/generated.patch" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Save patch artifact
        if: steps.render.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubara-generated-patch
          path: ${{ runner.temp }}/kubara/generated.patch
          retention-days: 7

      # Optional: use a GitHub App token so pushes and PRs trigger other workflows.
      # Set APP_CLIENT_ID (variable) and APP_PRIVATE_KEY (secret), then uncomment:
      # - name: Create automation token
      #   id: app-token
      #   if: steps.render.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.write)
      #   uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      #   with:
      #     client-id: ${{ vars.APP_CLIENT_ID }}
      #     private-key: ${{ secrets.APP_PRIVATE_KEY }}
      #     owner: ${{ github.repository_owner }}
      #     repositories: ${{ github.event.repository.name }}
      #     permission-contents: write
      #     permission-pull-requests: write

      - name: Commit generated changes to PR
        if: steps.render.outputs.changed == 'true' && steps.target.outputs.is_pr == 'true' && (github.event_name != 'workflow_dispatch' || inputs.write)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request }}
          EXPECTED_HEAD: ${{ steps.target.outputs.head }}
          PR_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" | jq -e \
            --arg sha "$EXPECTED_HEAD" --arg branch "$PR_BRANCH" \
            '.state == "open" and .head.sha == $sha and .head.ref == $branch'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'chore: regenerate kubara artifacts'
          git -c core.hooksPath=/dev/null -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$PR_BRANCH"

      - name: Update PR comment
        if: steps.target.outputs.is_pr == 'true' && !cancelled() && steps.render.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request }}
          RESULT: ${{ steps.render.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '<!-- kubara-generate -->'
            printf '### Kubara generate: %s\n\n[Workflow run](%s)\n\n' "$RESULT" "$RUN_URL"
            echo '<details><summary>Generation output (last 40 KB)</summary><pre>'
            # Strip ANSI terminal escape codes and HTML-escape characters for comment rendering
            tail -c 40000 "$RUNNER_TEMP/kubara/generate.log" \
              | sed -E $'s/\x1b\\[[0-9;]*[[:alpha:]]//g' \
              | sed 's/\&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
            echo '</pre></details>'
          } > "$RUNNER_TEMP/kubara/comment.md"
          # Locate existing bot comment by HTML marker to update it in-place instead of spamming new comments
          comment_id=$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- kubara-generate -->"))) | .id' | head -n 1)
          endpoint="repos/$REPOSITORY/issues/$PR_NUMBER/comments"
          method=POST
          if [[ -n "$comment_id" ]]; then
            endpoint="repos/$REPOSITORY/issues/comments/$comment_id"
            method=PATCH
          fi
          jq -n --rawfile body "$RUNNER_TEMP/kubara/comment.md" '{body: $body}' \
            | gh api --method "$method" "$endpoint" --input - > /dev/null

      - name: Open PR for drift on default branch
        if: steps.render.outputs.changed == 'true' && steps.target.outputs.is_pr == 'false' && (github.event_name != 'workflow_dispatch' || inputs.write)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          DEFAULT_BRANCH: ${{ steps.target.outputs.branch }}
          DRIFT_BRANCH: automation/kubara-drift
        run: |
          # Query remote SHA to update an existing drift branch with --force-with-lease safely
          remote_ref="refs/heads/$DRIFT_BRANCH"
          remote_state=$(git -c core.hooksPath=/dev/null -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' ls-remote origin "$remote_ref") || exit 1
          expected_sha=$(printf '%s\n' "$remote_state" | awk '{print $1}')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$DRIFT_BRANCH"
          git -c core.hooksPath=/dev/null commit -m 'chore: regenerate kubara artifacts'
          git -c core.hooksPath=/dev/null -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' push origin \
            --force-with-lease="$remote_ref:$expected_sha" "HEAD:$remote_ref"
          existing_pr=$(gh pr list --head "$DRIFT_BRANCH" --base "$DEFAULT_BRANCH" --json number --jq '.[0].number')
          if [[ -z "$existing_pr" ]]; then
            gh pr create \
              --head "$DRIFT_BRANCH" \
              --base "$DEFAULT_BRANCH" \
              --title 'chore: regenerate kubara artifacts' \
              --body 'Automated drift detection identified changes between configured catalogs and committed manifests.'
          fi
