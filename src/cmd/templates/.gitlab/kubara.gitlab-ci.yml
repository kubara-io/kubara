---
# Generated by kubara init --gitlab-ci.
kubara-generate:
  stage: test
  image:
    name: ghcr.io/kubara-io/kubara:0.18.0
    entrypoint: ['']
  variables:
    GIT_DEPTH: '0'
  resource_group: kubara-generate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE != "merge_train"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache git
    # Optional: log into a private catalog registry. Set CI_REGISTRY_USER and CI_REGISTRY_PASSWORD, then uncomment:
    # - >-
    #   echo "$CI_REGISTRY_PASSWORD" | /kubara catalog login \
    #     --username "$CI_REGISTRY_USER" \
    #     --password-stdin \
    #     "$CI_REGISTRY"
  script:
    - |
      # In merged-results pipelines HEAD is a temporary merge commit; detach on source branch HEAD instead
      if [ "$CI_MERGE_REQUEST_EVENT_TYPE" = "merged_result" ]; then
        git fetch origin "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        git checkout --detach "$CI_MERGE_REQUEST_SOURCE_BRANCH_SHA"
      fi
    - mkdir -p /tmp/kubara-home
    - |
      if [ -f "$HOME/.kubara/credentials.json" ]; then
        mkdir -p /tmp/kubara-home/.kubara
        cp "$HOME/.kubara/credentials.json" /tmp/kubara-home/.kubara/credentials.json
      fi
    - env -i PATH="$PATH" HOME="/tmp/kubara-home" LANG=C.UTF-8 /kubara generate
    - |
      existing_dirs=""
      for d in platform-components platform-configs; do
        if [ -d "$d" ]; then
          existing_dirs="$existing_dirs $d"
        fi
      done
      if [ -n "$existing_dirs" ]; then
        find $existing_dirs -type f \( -name 'set-env-changeme.sh' -o -name 'set-env-changeme.ps1' \) -delete
      fi
    - |
      # Kubara also persists schema migrations to its source configuration.
      for path in config.yaml platform-configs platform-components; do
        if [ -e "$path" ] || [ -n "$(git ls-files -- "$path")" ]; then
          git add -A -- "$path"
        fi
      done
      if git diff --cached --quiet; then
        echo 'No drift detected in generated platform artifacts.'
        exit 0
      fi
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo 'Changes detected in generated artifacts on merge request.'
        git diff --cached --stat
        git config user.name 'kubara automation'
        git config user.email '[EMAIL_REDACTED]'
        git commit -m 'chore: regenerate kubara artifacts'
        askpass=$(mktemp)
        trap 'rm -f "$askpass"' EXIT
        cat > "$askpass" <<'SH'
      #!/bin/sh
      case "$1" in
        *Username*)
          if [ -n "${KUBARA_UPDATE_TOKEN:-}" ]; then
            echo oauth2
          else
            echo gitlab-ci-token
          fi
          ;;
        *) printf '%s\n' "${KUBARA_UPDATE_TOKEN:-$CI_JOB_TOKEN}" ;;
      esac
      SH
        chmod 700 "$askpass"
        GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -c credential.helper= push "$CI_PROJECT_URL.git" "HEAD:refs/heads/$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      else
        echo 'Drift detected on default branch. Opening or updating merge request.'
        askpass=$(mktemp)
        trap 'rm -f "$askpass"' EXIT
        cat > "$askpass" <<'SH'
      #!/bin/sh
      case "$1" in
        *Username*)
          if [ -n "${KUBARA_UPDATE_TOKEN:-}" ]; then
            echo oauth2
          else
            echo gitlab-ci-token
          fi
          ;;
        *) printf '%s\n' "${KUBARA_UPDATE_TOKEN:-$CI_JOB_TOKEN}" ;;
      esac
      SH
        chmod 700 "$askpass"
        export GIT_ASKPASS="$askpass"
        export GIT_TERMINAL_PROMPT=0
        branch=automation/kubara-drift
        # Query remote SHA to update an existing drift branch with --force-with-lease safely
        remote_ref="refs/heads/$branch"
        remote_state=$(git -c credential.helper= ls-remote "$CI_PROJECT_URL.git" "$remote_ref") || exit 1
        expected_sha=$(printf '%s\n' "$remote_state" | awk '{print $1}')
        git checkout -B "$branch"
        git config user.name 'kubara automation'
        git config user.email '[EMAIL_REDACTED]'
        git commit -m 'chore: regenerate kubara artifacts'
        git -c credential.helper= push \
          --force-with-lease="$remote_ref:$expected_sha" \
          -o merge_request.create \
          -o merge_request.target="$CI_DEFAULT_BRANCH" \
          -o merge_request.title="chore: regenerate kubara artifacts" \
          -o merge_request.remove_source_branch \
          "$CI_PROJECT_URL.git" "HEAD:$remote_ref"
      fi
